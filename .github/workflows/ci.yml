name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    name: JS workspace (bun)
    runs-on: ubuntu-latest
    env:
      NX_TUI: false
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.20

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun nx run-many -t typecheck --exclude @atlas/intelligence

      - name: Test
        run: bun nx run-many -t test --exclude @atlas/intelligence

      - name: Build
        run: bun run build

  python:
    name: services/intelligence (uv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/intelligence
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/intelligence/uv.lock

      - run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest

  deploy:
    name: Deploy Atlas VPS
    needs: [javascript, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build AMD64 images
        run: |
          docker build --platform linux/amd64 -f deploy/vps/Dockerfile.bun --target web -t "atlas-web:$ATLAS_IMAGE_TAG" .
          docker build --platform linux/amd64 -f deploy/vps/Dockerfile.bun --target backend -t "atlas-backend:$ATLAS_IMAGE_TAG" .
          docker build --platform linux/amd64 -f deploy/vps/Dockerfile.intelligence -t "atlas-intelligence:$ATLAS_IMAGE_TAG" .
          docker save "atlas-web:$ATLAS_IMAGE_TAG" "atlas-backend:$ATLAS_IMAGE_TAG" "atlas-intelligence:$ATLAS_IMAGE_TAG" | gzip > "$RUNNER_TEMP/atlas-images.tar.gz"

      - name: Configure SSH
        env:
          ATLAS_SSH_PRIVATE_KEY: ${{ secrets.ATLAS_SSH_PRIVATE_KEY }}
          ATLAS_SSH_KNOWN_HOSTS: ${{ secrets.ATLAS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$ATLAS_SSH_PRIVATE_KEY"
          test -n "$ATLAS_SSH_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$ATLAS_SSH_PRIVATE_KEY" > ~/.ssh/atlas_deploy
          printf '%s\n' "$ATLAS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<'EOF'
          Host atlas-vps
            HostName 37.59.105.85
            User debian
            Port 22
            IdentityFile ~/.ssh/atlas_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ServerAliveInterval 30
          EOF

      - name: Transfer and deploy
        run: |
          ssh atlas-vps 'test -s /opt/atlas/.env'
          printf 'mkdir -p /opt/atlas/releases/%s\n' "$ATLAS_IMAGE_TAG" | ssh atlas-vps 'bash -se'
          scp compose.vps.yaml deploy/vps/deploy.sh "atlas-vps:/opt/atlas/releases/$ATLAS_IMAGE_TAG/"
          ssh atlas-vps 'sudo -n docker load' < "$RUNNER_TEMP/atlas-images.tar.gz"
          printf 'bash /opt/atlas/releases/%s/deploy.sh %s\n' "$ATLAS_IMAGE_TAG" "$ATLAS_IMAGE_TAG" | ssh atlas-vps 'bash -se'

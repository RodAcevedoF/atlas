map $http_x_forwarded_proto $atlas_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $atlas_api http://api:3100;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $atlas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $atlas_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
